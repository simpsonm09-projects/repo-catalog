# Pinned tools for the catalog. See
# https://github.com/simpsonm09-projects/repo-standard/blob/main/docs/task-runner.md

[tools]

# Task runner
"aqua:casey/just" = "1.59.0"

# Git hooks and secret scanning
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"

# Workflow linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# Node runs the validator and the repository scripts.
node = "26.13.1"

# AI-slop gate, pinned so CI resolves no version at run time (C7.2).
"npm:aislop" = "0.16.1"

# Linters
"aqua:grafana/flint" = "0.22.14"
biome = "2.5.14"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Validate the roster against the organization"
run = "node scripts/validate.mjs"
